<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inaco | Gestión de Vigiladores</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{--navy:#102a43;--blue:#1479d1;--light:#f4f7fb;--line:#dbe4ee;--danger:#c53d3d;--ok:#18865b;--ink:#1c2b3a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--light);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:650}
    .primary{background:var(--blue);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--navy)}
    .danger{background:#fff0f0;color:var(--danger)}.hidden{display:none!important}
    .topbar{background:var(--navy);color:#fff;padding:14px max(20px,calc((100% - 1200px)/2));display:flex;gap:12px;align-items:center}
    .brand{font-size:19px;font-weight:800}.brand small{display:block;font-size:10px;color:#a9c9e9;letter-spacing:1.4px}
    .spacer{flex:1}.container{max-width:1200px;margin:24px auto;padding:0 18px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
    .search{flex:1;min-width:230px;padding:10px 13px;border:1px solid var(--line);border-radius:8px}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #102a4309}
    .list{overflow:hidden}
    .row{display:grid;grid-template-columns:52px 1fr auto auto;gap:13px;align-items:center;padding:12px 16px;border-bottom:1px solid #edf1f5}
    .row:last-child{border:0}
    .row-baja {opacity: 0.6;background-color: #f8f9fa}
    .row-baja .avatar {filter: grayscale(100%)}
    .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#d9eafa;color:#14518c;display:grid;place-items:center;font-weight:800}
    .muted{font-size:12px;color:#657587}.warning{color:#bd6d00;font-size:20px}
    .empty{text-align:center;padding:45px;color:#657587}
    .modal-bg{position:fixed;inset:0;background:#102a4388;display:grid;place-items:center;padding:18px;z-index:5}
    .modal{max-width:940px;width:100%;max-height:94vh;overflow:auto;background:white;border-radius:14px}
    .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
    .modal-body{padding:20px 22px}
    .tabs{display:flex;overflow:auto;border-bottom:1px solid var(--line);position:sticky;top:63px;background:#fff;z-index:1}
    .tab{white-space:nowrap;border-radius:0;background:transparent;color:#617183;padding:13px 16px}
    .tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}
    .pane{display:none}.pane.active{display:block}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:12px;font-weight:700;color:#526273}
    .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
    .field textarea{min-height:92px;resize:vertical}.wide{grid-column:span 2}.full{grid-column:1/-1}
    .section-title{font-weight:800;margin:5px 0 15px;color:var(--navy)}
    .photo-wrap{display:flex;gap:15px;align-items:center;margin-bottom:18px}.photo-wrap .avatar{width:75px;height:75px;font-size:23px}
    .array-form{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:9px;align-items:end;margin:14px 0}
    .data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}
    .data-table th{color:#526273}
    .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:white}
    .s{padding:16px;margin:-8px 0 18px}
    .auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a43,#1b4f7c)}
    .auth-card{width:min(410px,calc(100% - 32px));padding:32px}.auth-card h1{margin:0;color:var(--navy)}
    .auth-card .field{margin:14px 0}.auth-card button{width:100%;margin-top:8px}
    .link{color:var(--blue);background:none;padding:6px 0}
    .toast{position:fixed;bottom:20px;right:20px;background:#172b3a;color:white;padding:13px 18px;border-radius:9px;z-index:20;box-shadow:0 6px 20px #0004}
    .spin{width:17px;height:17px;border:2px solid #fff7;border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:middle;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.array-form{grid-template-columns:1fr 1fr}.row{grid-template-columns:45px 1fr auto}.row .edit{display:none}.topbar{padding:12px 16px}.modal-body{padding:16px}.modal-head{padding:15px 16px}.modal-foot{padding:14px 16px}}
    
  </style>
</head>
<body>
  <div id="loading" class="hidden" style="position:fixed;inset:0;background:#102a4344;z-index:30;display:grid;place-items:center">
    <div style="background:#fff;padding:18px;border-radius:10px">
      <span class="spin" style="border-color:#1479d155;border-top-color:#1479d1"></span> Procesando…
    </div>
  </div>

  <main id="authView" class="auth">
    <section class="auth-card card">
      <h1>Centinela</h1>
      <p class="muted">Gestión integral de vigiladores</p>
      <div class="field"><label>Email</label><input id="authEmail" type="email"></div>
      <div class="field"><label>Contraseña</label><input id="authPassword" type="password" minlength="6"></div>
      <button class="primary" onclick="login()">Ingresar</button>
    </section>
  </main>

  <main id="appView" class="hidden">
    <header class="topbar">
      <div class="brand">CENTINELA<small>INACO SEGURIDAD</small></div>
      <span class="spacer"></span>
      <span id="userEmail" class="muted" style="color:#d6e8fa"></span>
      <button class="secondary" onclick="auth.signOut()">Salir</button>
    </header>

    <section class="container">
      <div class="toolbar">
        <input id="search" class="search" placeholder="Buscar por nombre, apellido o DNI…" oninput="render()">
        <select id="filtroEstado" onchange="render()" style="padding:10px 13px; border:1px solid var(--line); border-radius:8px; background:white;">
            <option value="todos">Todos</option>
            <option value="ALTA">🟢 Activos</option>
            <option value="BAJA_PROCESO">🟡 En proceso de baja</option>
            <option value="BAJA_DEFINITIVA">🔴 Bajas definitivas</option>
        </select>
        <button class="secondary" onclick="toggleFilters()">Filtros avanzados</button>
        <button class="secondary" onclick="exportJSON()">Exportar JSON</button>
        <label class="secondary" style="padding:10px 14px;font-weight:650;cursor:pointer">
          Importar JSON
          <input type="file" accept=".json" class="hidden" onchange="importJSON(event)">
        </label>

        <span id="adminButtons" class="hidden">
          <label class="secondary" style="padding:10px 14px;font-weight:650;cursor:pointer">
            Importar altas Excel
            <input type="file" accept=".xlsx,.xls" class="hidden" onchange="excelAltas(event)">
          </label>
          <label class="secondary" style="padding:10px 14px;font-weight:650;cursor:pointer">
            Importar suspensiones
            <input type="file" accept=".xlsx,.xls" class="hidden" onchange="excelSuspensiones(event)">
          </label>
        </span>

        <button class="primary" onclick="openModal()">+ Nuevo Vigilador</button>
      </div>

      <form id="filterForm" class="filters card hidden">
        <div class="grid">
          <div class="field">
            <label>Habilitación</label>
            <select name="habTipo" onchange="render()">
              <option value="">Todas</option><option>Provincia</option><option>CABA</option>
            </select>
          </div>
          <div class="field"><label>Vence antes de</label><input type="date" name="venceAntes" onchange="render()"></div>
          <div class="field">
            <label>Categoría</label>
            <select name="categoria" onchange="render()">
              <option value="">Todas</option><option>Vigilador</option><option>Vigilador Senior</option><option>Supervisor</option><option>Jefe de Seguridad</option>
            </select>
          </div>
          <div class="field"><label>Domicilio</label><input name="domicilio" oninput="render()"></div>
        </div>
      </form>

      <div class="card list" id="list"><div class="empty">Cargando vigiladores…</div></div>
    </section>
  </main>

  <div id="modalHost"></div>

  <script>
    /*
      CONFIGURACIÓN FIREBASE:
      Reemplazá todos los valores con los datos de Firebase Console > Configuración del proyecto.
    */
    const firebaseConfig = {
      apiKey: "AIzaSyDBZo39bVcQ3hdhC5FOjYOlwiI-oJ2pCWA",
      authDomain: "vigiapp-ff701.firebaseapp.com",
      projectId: "vigiapp-ff701",
      storageBucket: "vigiapp-ff701.firebasestorage.app",
      messagingSenderId: "271978217168",
      appId: "1:271978217168:web:750dab0ca60ac350d1a8d5"
    };

    // Correos autorizados a importar altas y suspensiones.
    const ADMIN_EMAILS = ["adrianmascaro@outlook.com.ar"];

    let db, auth, currentUser, vigiladores = [], editing = null, activeTab = 0;
    let arrays = { entregas: [], evaluaciones: [], sanciones: [] };

    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>'"]/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"
    }[c]));

    const sizesNum = Array.from({length:13}, (_,i) => 36 + i * 2);
    const tiposPrenda = ["Camisa", "Pantalón", "Tricota", "Campera", "Corbata", "Cinturón"];
    
    const PRENDAS_ESTANDAR = [
        { tipo: 'Camisa', cantidad: 2 },
        { tipo: 'Pantalón', cantidad: 2 },
        { tipo: 'Tricota', cantidad: 1 },
        { tipo: 'Campera', cantidad: 1 },
        { tipo: 'Cinturón', cantidad: 1 },
        { tipo: 'Corbata', cantidad: 1 }
    ];

    const ETAPAS_PROCESO = {
        'mediacion': 'Mediación',
        'intimacion': 'Intimación',
        'notificacion': 'Notificaciones legales',
        'cierre': 'Cierre de expediente'
    };
    const ETAPAS_ORDEN = ['mediacion', 'intimacion', 'notificacion', 'cierre'];
    
    const sizesLetter = ["S","M","L","XL","XXL","XXXL"];

    function options(list, selected = "") {
      return list.map(x => `<option ${String(x) === String(selected) ? "selected" : ""}>${x}</option>`).join("");
    }

    function toast(msg, error = false) {
      const box = document.createElement("div");
      box.className = "toast";
      box.style.background = error ? "#a63131" : "#18865b";
      box.textContent = msg;
      document.body.append(box);
      setTimeout(() => box.remove(), 3500);
    }

    function loading(show) {
      $("#loading").classList.toggle("hidden", !show);
    }

    function initials(v) {
      return ((v.nombre || "").slice(0,1) + (v.apellido || "").slice(0,1)).toUpperCase() || "?";
    }

    function norm(x) {
      return String(x ?? "").trim().toLowerCase().normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function init() {
      try {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();

        auth.onAuthStateChanged(user => {
          currentUser = user;
          if (user) {
            $("#authView").classList.add("hidden");
            $("#appView").classList.remove("hidden");
            $("#userEmail").textContent = user.email;
            $("#adminButtons").classList.toggle("hidden", !ADMIN_EMAILS.includes(user.email));
            listen();
          } else {
            $("#authView").classList.remove("hidden");
            $("#appView").classList.add("hidden");
          }
        });
      } catch (error) {
        toast("Configurá Firebase antes de usar la aplicación.", true);
      }
    }

    function login() {
      auth.signInWithEmailAndPassword($("#authEmail").value, $("#authPassword").value)
        .catch(e => toast(e.message, true));
    }

    function register() {
      auth.createUserWithEmailAndPassword($("#authEmail").value, $("#authPassword").value)
        .catch(e => toast(e.message, true));
    }

    function listen() {
      loading(true);
      db.collection("vigiladores").onSnapshot(snapshot => {
        vigiladores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
        loading(false);
      }, error => {
        loading(false);
        toast("No se pudo leer Firestore: " + error.message, true);
      });
    }

    function calcularDiasRestantes(fecha) {
      if (!fecha) return null;
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const venc = new Date(fecha);
      venc.setHours(0, 0, 0, 0);
      const diff = Math.ceil((venc - hoy) / (1000 * 60 * 60 * 24));
      return diff;
    }

    function calcularPrendasPendientes(vigilador) {
      if (!vigilador) return [];
    
    // Obtener todas las entregas de ropa
      const entregas = vigilador.entregasRopa || [];
    
    // Acumular cantidades entregadas por tipo (sin importar talla)
      const entregado = {};
      entregas.forEach(entrega => {
          entrega.prendas.forEach(prenda => {
              const clave = prenda.tipo;
              if (!entregado[clave]) entregado[clave] = 0;
              entregado[clave] += prenda.cantidad;
          });
      });

    // Calcular faltantes comparando con el estándar
      const pendientes = [];
      PRENDAS_ESTANDAR.forEach(estandar => {
          const entregadoCantidad = entregado[estandar.tipo] || 0;
          const faltante = estandar.cantidad - entregadoCantidad;
          if (faltante > 0) {
              pendientes.push({
                  tipo: estandar.tipo,
                  faltante: faltante,
                  requerido: estandar.cantidad,
                  entregado: entregadoCantidad
              });
          }
      });
      return pendientes;
    }

    // -------- FUNCIONES PARA GESTIÓN DE ROPA --------

    function renderHistorialRopa() {
        const entregas = editing?.entregasRopa || [];
        if (entregas.length === 0) {
            return '<div class="muted" style="padding:20px; text-align:center;">No hay entregas registradas.</div>';
        }

        const sorted = [...entregas].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

        let html = `<table class="data-table" style="width:100%;">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Prendas</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>`;

        sorted.forEach(entrega => {
            const detallePrendas = entrega.prendas.map(p => 
                `${p.tipo} x${p.cantidad} (talle ${p.talla})`
            ).join(', ');

            html += `
                <tr>
                    <td>${entrega.fecha}</td>
                    <td>${entrega.tipo === 'inicial' ? 'Entrega inicial' : 'Cambio'}</td>
                    <td>${detallePrendas}</td>
                    <td>
                        <button type="button" class="danger" onclick="eliminarEntregaRopa('${entrega.id}')" style="background:transparent; border:none; color:#c53d3d; cursor:pointer;">🗑️</button>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        return html;
    }

    let tipoEntregaActual = 'inicial';

    function mostrarFormularioRopa(tipo) {
        tipoEntregaActual = tipo;
        const form = document.getElementById('formularioRopa');
        if (!form) {
            toast('El formulario de ropa no está disponible.', true);
            return;
        }
        form.style.display = 'block';
        document.getElementById('tituloFormularioRopa').textContent = tipo === 'inicial' ? 'Nueva entrega inicial' : 'Registrar cambio';
        document.getElementById('tipoEntrega').value = tipo;
        document.getElementById('fechaEntrega').value = new Date().toISOString().slice(0, 10);
    
        const container = document.getElementById('prendasContainer');
        container.innerHTML = '';
        agregarFilaPrenda();
    }

    function ocultarFormularioRopa() {
        const form = document.getElementById('formularioRopa');
        if (form) form.style.display = 'none';
    }

    function agregarFilaPrenda() {
        const container = document.getElementById('prendasContainer');
        if (!container) return;

        const fila = document.createElement('div');
        fila.className = 'fila-prenda';
        fila.style.cssText = 'display:flex; gap:10px; align-items:end; margin-bottom:8px;';
        fila.innerHTML = `
            <div class="field" style="flex:2;">
                <label for="tipoPrenda_${Date.now()}">Tipo</label>
                <select class="select-tipo-prenda" id="tipoPrenda_${Date.now()}" onchange="actualizarTallas(this)">
                    ${tiposPrenda.map(t => `<option value="${t}">${t}</option>`).join('')}
                </select>
            </div>
            <div class="field" style="flex:1;">
                <label for="tallaPrenda_${Date.now()}">Talla</label>
                <select class="select-talla-prenda" id="tallaPrenda_${Date.now()}">
                    <!-- Se llenará dinámicamente -->
                </select>
            </div>
            <div class="field" style="flex:1;">
                <label for="cantidadPrenda_${Date.now()}">Cantidad</label>
                <input type="number" class="input-cantidad" id="cantidadPrenda_${Date.now()}" value="1" min="1" max="10">
            </div>
            <button type="button" class="secondary danger" onclick="eliminarFilaPrenda(this)" style="margin-bottom:2px;">✕</button>
        `;
        container.appendChild(fila);
    
        const selectTipo = fila.querySelector('.select-tipo-prenda');
        actualizarTallas(selectTipo);
    }

    function eliminarFilaPrenda(btn) {
        const fila = btn.closest('.fila-prenda');
        const container = document.getElementById('prendasContainer');
        if (container.children.length > 1) {
            fila.remove();
        } else {
            toast('Debe haber al menos una prenda.', true);
        }
    }

    function actualizarTallas(selectTipo) {
        const fila = selectTipo.closest('.fila-prenda');
        const selectTalla = fila.querySelector('.select-talla-prenda');
        const tipo = selectTipo.value;
        let tallas = [];
    
        switch(tipo) {
            case 'Camisa':
            case 'Pantalón':
                tallas = sizesNum;
                break;
            case 'Tricota':
            case 'Campera':
                tallas = sizesLetter;
                break;
            case 'Corbata':
                tallas = ['Única', 'Regular', 'Larga'];
                break;
            case 'Cinturón':
                tallas = [90,100,110,120,130,140,150,160];
                break;
            default:
                tallas = [];
        }
    
        selectTalla.innerHTML = tallas.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    async function guardarEntregaRopa() {
        const filas = document.querySelectorAll('#prendasContainer .fila-prenda');
        if (filas.length === 0) {
            toast('Debe agregar al menos una prenda.', true);
            return;
        }

        const fecha = document.getElementById('fechaEntrega').value;
        if (!fecha) {
            toast('Seleccione una fecha.', true);
            return;
        }

        const tipo = document.getElementById('tipoEntrega').value;
        const prendas = [];

        filas.forEach(fila => {
            const tipoPrenda = fila.querySelector('.select-tipo-prenda').value;
            const talla = fila.querySelector('.select-talla-prenda').value;
            const cantidad = parseInt(fila.querySelector('.input-cantidad').value) || 0;
            if (cantidad > 0) {
                prendas.push({ tipo: tipoPrenda, talla: talla, cantidad: cantidad });
            }
        });

        if (prendas.length === 0) {
            toast('Debe registrar al menos una prenda con cantidad mayor a 0.', true);
            return;
        }

        const nuevaEntrega = {
            id: 'entrega_' + Date.now(),
            fecha: fecha,
            tipo: tipo,
            prendas: prendas
        };

        if (!editing.entregasRopa) editing.entregasRopa = [];
        editing.entregasRopa.push(nuevaEntrega);

        try {
            loading(true);
            await db.collection('vigiladores').doc(editing.id).update({
                entregasRopa: editing.entregasRopa
            });
            toast('Entrega de ropa registrada correctamente.');
            ocultarFormularioRopa();
            renderPanes();
        } catch (error) {
            toast('Error al guardar: ' + error.message, true);
        } finally {
            loading(false);
        }
    }

    async function eliminarEntregaRopa(id) {
        if (!confirm('¿Eliminar este registro de entrega? Esta acción no se puede deshacer.')) return;
    
        const entregas = editing.entregasRopa || [];
        const nuevasEntregas = entregas.filter(e => e.id !== id);
        if (nuevasEntregas.length === entregas.length) {
            toast('No se encontró la entrega.', true);
            return;
        }

        try {
            loading(true);
            await db.collection('vigiladores').doc(editing.id).update({
                entregasRopa: nuevasEntregas
            });
            editing.entregasRopa = nuevasEntregas;
            toast('Registro eliminado.');
            renderPanes();
        } catch (error) {
            toast('Error al eliminar: ' + error.message, true);
        } finally {
            loading(false);
        }
    }

    // Avanzar etapa del proceso de baja
    async function avanzarEtapaProceso(id) {
        if (!id) return;
        const vigilador = vigiladores.find(v => v.id === id);
        if (!vigilador || vigilador.estado !== 'BAJA_PROCESO') {
            toast('El vigilador no está en proceso de baja.', true);
            return;
        }
        const etapaActual = vigilador.etapaProceso || 'mediacion';
        const indexActual = ETAPAS_ORDEN.indexOf(etapaActual);
        if (indexActual === -1 || indexActual === ETAPAS_ORDEN.length - 1) {
            toast('Ya está en la última etapa. Usá "Finalizar baja" para cerrar el proceso.', true);
            return;
        }
        const siguienteEtapa = ETAPAS_ORDEN[indexActual + 1];
        try {
            loading(true);
            await db.collection("vigiladores").doc(id).update({
                etapaProceso: siguienteEtapa,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            await db.collection("vigiladores").doc(id).update({

            });

        } catch (error) {
            toast("Error al finalizar baja: " + error.message, true);
        } finally {
            loading(false);
        }
    }

    function render() {
        const query = ($("#search").value || "").toLowerCase();
        const form = $("#filterForm");

        let list = vigiladores.filter(v =>
            `${v.nombre} ${v.apellido} ${v.dni}`.toLowerCase().includes(query)
        );

      // Filtro por estado (desde el selector)
        const estadoFiltro = document.getElementById('filtroEstado').value;
        if (estadoFiltro !== 'todos') {
            list = list.filter(v => v.estado === estadoFiltro);
        }
      
    // Aplicar filtros avanzados (si están visibles)
        if (!form.classList.contains("hidden")) {
            const data = new FormData(form);
            const minNota = Number(data.get("minNota") || 0);

            list = list.filter(v =>
                (!data.get("categoria") || v.categoria === data.get("categoria")) &&
                (!data.get("domicilio") || norm(v.domicilio).includes(norm(data.get("domicilio")))) &&
                (!data.get("habTipo") || v.habilitacionTipo === data.get("habTipo")) &&
                (!data.get("venceAntes") || !v.habilitacionVencimiento || v.habilitacionVencimiento <= data.get("venceAntes"))
            );
        }

    // Ordenar alfabéticamente por apellido
      list.sort((a, b) => (a.apellido || "").localeCompare(b.apellido || ""));

    // Construir el HTML de la lista (SOLO UNA VEZ)
      $("#list").innerHTML = list.length ? list.map(v => {
        // █████████████████████████████████████████████
        // 1. ADVERTENCIA DE VENCIMIENTO (ícono)
        // █████████████████████████████████████████████
            const diff = calcularDiasRestantes(v.habilitacionVencimiento);
            let warningIcon = '';
            if (diff !== null && diff <= 30 && diff >= 0) {
                warningIcon = `<span style="color:#dc3545; font-weight:bold; margin-left:5px;" title="Vence en ${diff} días">⚠️</span>`;
            }

        // █████████████████████████████████████████████
        // 2. ESTADO DEL VIGILADOR (ALTA / BAJA)
        // █████████████████████████████████████████████
            const esBaja = v.estado === 'BAJA';
            const estadoLabel = esBaja ? '<span style="color:#c53d3d; font-weight:bold; margin-left:8px;">(Dado de baja)</span>' : '';

            const pendientes = calcularPrendasPendientes(v);
            const tienePendientes = pendientes.length > 0;
            let iconoRopa = '';
            if (tienePendientes) {
                const detalle = pendientes.map(p => `${p.tipo} x${p.faltante}`).join(', ');
                iconoRopa = `<span style="margin-left:5px; color:#856404; cursor:help;" title="Faltan prendas: ${detalle}">🧥</span>`;
            }
        
        // █████████████████████████████████████████████
        // 3. BOTÓN DE ACCIÓN (Dar de baja / Reactivar)
        // █████████████████████████████████████████████
            let botonAccion;
                if (esBaja) {
                    botonAccion = `<button class="secondary" onclick="reactivar('${v.id}')" style="color:#18865b;">Reactivar</button>`;
                } else {
                    botonAccion = `<button class="secondary danger" onclick="darDeBaja('${v.id}')" style="border-color:#c53d3d; color:#c53d3d;">Dar de baja</button>`;
                }

                return `
                    <div class="row ${esBaja ? 'row-baja' : ''}">
                        <div class="avatar">${v.foto ? `<img class="avatar" src="${v.foto}">` : initials(v)}</div>
                        <div>
                            <strong>${esc(v.apellido)}, ${esc(v.nombre)} ${warningIcon} ${estadoLabel} ${iconoRopa}</strong>

                        <div style="display:flex; gap:8px; align-items:center;">

                    </div>
                `;
      }).join("") : '<div class="empty">No se encontraron vigiladores.</div>';
    }    
    
    function toggleFilters() {
      $("#filterForm").classList.toggle("hidden");

    function field(label, key, type = "text", cls = "") {
      const value = editing?.[key] ?? "";
      return `<div class="field ${cls}">
        <label>${label}</label>
        ${type === "textarea"
          ? `<textarea name="${key}">${esc(value)}</textarea>`
          : `<input name="${key}" type="${type}" value="${esc(value)}">`
        }
      </div>`;
    }

    function select(label, key, values, cls = "") {
      return `<div class="field ${cls}">
        <label>${label}</label>
        <select name="${key}">
          <option value="">Seleccionar</option>
          ${options(values, editing?.[key])}
        </select>
      </div>`;
    }

                <div id="formularioRopa" style="display:none; border:1px solid #ddd; padding:15px; border-radius:8px; margin-top:15px; background:#f9f9f9;">
                    <h4 id="tituloFormularioRopa">Nueva entrega</h4>
                    <div class="grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="field">
                            <label for="fechaEntrega">Fecha</label>
                            <input type="date" id="fechaEntrega" value="${new Date().toISOString().slice(0,10)}">
                        </div>
                        <div class="field">
                            <label for="tipoEntrega">Tipo</label>
                            <select id="tipoEntrega" disabled>
                                <option value="inicial">Entrega inicial</option>
                                <option value="cambio">Cambio</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top:15px;">
                        <label><strong>Prendas entregadas</strong></label>
                        <div id="prendasContainer">
                            <!-- Las filas se agregan dinámicamente -->
                        </div>
                        <button type="button" class="secondary" onclick="agregarFilaPrenda()" style="margin-top:8px;">➕ Agregar otra prenda</button>
                    </div>

                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button type="button" class="primary" onclick="guardarEntregaRopa()">Guardar entrega</button>
                        <button type="button" class="secondary" onclick="ocultarFormularioRopa()">Cancelar</button>
                    </div>
                </div>
            </section>

            <section class="pane ${activeTab === 4 ? "active" : ""}">
                <div class="grid">${field("Observaciones","observaciones","textarea","full")}</div>
                <div id="evaluacionesBox"></div>
            </section>

            <section class="pane ${activeTab === 5 ? "active" : ""}">
                <div id="sancionesBox"></div>
            </section>
        `;

    // █████████████████████████████████████████████████████████
    // 4. EVENTOS Y RENDERIZADO DE ARRAYS (igual que antes)
    // █████████████████████████████████████████████████████████
        $("#photoInput")?.addEventListener("change", readPhoto);
        renderArrays();
    }
    
    function showTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".tab").forEach((x,i) => x.classList.toggle("active", i === tab));
      document.querySelectorAll(".pane").forEach((x,i) => x.classList.toggle("active", i === tab));
    }

    function readPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 900000) return toast("La foto debe pesar menos de 900 KB.", true);

      const reader = new FileReader();
      reader.onload = () => {
        editing.foto = reader.result;
        $("#photoPreview").innerHTML = `<img class="avatar" src="${reader.result}">`;
      };
      reader.readAsDataURL(file);
    }

    function table(items, heads, keys, arrayName) {
      return `<table class="data-table">
        <thead><tr>${heads.map(x => `<th>${x}</th>`).join("")}<th></th></tr></thead>
        <tbody>
          ${items.length ? items.map((row,index) => `
            <tr>
              ${keys.map(key => `<td>${esc(row[key])}</td>`).join("")}
              <td><button type="button" class="danger" onclick="removeArray('${arrayName}',${index})">×</button></td>
            </tr>`).join("")
            : `<tr><td colspan="9" class="muted">Sin registros.</td></tr>`}
        </tbody>
      </table>`;
    }

    function renderArrays() {
      if ($("#entregasBox")) {
        $("#entregasBox").innerHTML = `
          <p class="section-title">Entregas</p>
          ${table(arrays.entregas,["Fecha","Tipo"],["fecha","tipo"],"entregas")}
          <div class="array-form">
            <div class="field"><label>Fecha</label><input id="entFecha" type="date"></div>
            <div class="field"><label>Tipo entregado</label><input id="entTipo"></div>
            <button type="button" class="secondary" onclick="addEntrega()">Agregar</button>
          </div>`;
      }

      if ($("#evaluacionesBox")) {
        $("#evaluacionesBox").innerHTML = `
          <p class="section-title">Evaluaciones</p>
          ${table(arrays.evaluaciones,["Fecha","Nota"],["fecha","nota"],"evaluaciones")}
          <div class="array-form">
            <div class="field"><label>Fecha</label><input id="evaFecha" type="date"></div>
            <div class="field"><label>Nota</label><input id="evaNota" type="number" min="1" max="10"></div>
            <button type="button" class="secondary" onclick="addEvaluacion()">Agregar</button>
          </div>`;
      }

      if ($("#sancionesBox")) {
        $("#sancionesBox").innerHTML = `
          <p class="section-title">Sanciones y apercibimientos</p>
          ${table(arrays.sanciones,["Fecha","Días/Apercibimiento","Servicio","Motivo"],["fecha","tipo","servicio","motivo"],"sanciones")}
          <div class="array-form">
            <div class="field"><label>Fecha</label><input id="sanFecha" type="date"></div>
            <div class="field"><label>Días / apercibimiento</label><input id="sanTipo" placeholder="Ej. 3 días"></div>
            <div class="field"><label>Servicio</label><input id="sanServicio"></div>
            <div class="field"><label>Motivo</label><input id="sanMotivo"></div>
            <button type="button" class="secondary" onclick="addSancion()">Agregar</button>
          </div>`;
      }
    }

    function addEntrega() {
      if ($("#entTipo").value) {
        arrays.entregas.push({fecha:$("#entFecha").value,tipo:$("#entTipo").value});
        renderArrays();
      }
    }

    function addEvaluacion() {
      if ($("#evaNota").value) {
        arrays.evaluaciones.push({fecha:$("#evaFecha").value,nota:$("#evaNota").value});
        renderArrays();
      }
    }

    function addSancion() {
      if ($("#sanMotivo").value) {
        arrays.sanciones.push({
          fecha:$("#sanFecha").value,
          tipo:$("#sanTipo").value,
          servicio:$("#sanServicio").value,
          motivo:$("#sanMotivo").value
        });
        renderArrays();
      }
    }

    function removeArray(name, index) {
      arrays[name].splice(index, 1);
      renderArrays();
    }

    async function saveVigilador(event) {
      event.preventDefault();

      const data = Object.fromEntries(new FormData(event.target));
      data.foto = editing.foto || "";
      data.entregas = arrays.entregas;
      data.evaluaciones = arrays.evaluaciones;
      data.sanciones = arrays.sanciones;
      data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

      try {
        loading(true);

        if (editing.id) {
          await db.collection("vigiladores").doc(editing.id).set(data, {merge:true});
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection("vigiladores").add(data);
        }

        closeModal();
        toast("Vigilador guardado correctamente.");
      } catch (error) {
        toast(error.message, true);
      } finally {
        loading(false);
      }
    }

    function closeModal() {
      $("#modalHost").innerHTML = "";
    }

    function download(name, content, type = "application/json") {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([content], {type}));
      link.download = name;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function exportJSON() {
      download("backup-vigiladores.json", JSON.stringify(vigiladores.map(({id,...v}) => v), null, 2));
      toast("Backup JSON generado.");
    }

    async function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const records = JSON.parse(await file.text());
        if (!Array.isArray(records)) throw new Error("El JSON debe contener una lista.");

        loading(true);
        await commitInChunks(records, (batch, record) => {
          batch.set(db.collection("vigiladores").doc(), record);
        });

        toast(`${records.length} registros importados.`);
      } catch (error) {
        toast(error.message, true);
      } finally {
        loading(false);
        event.target.value = "";
      }
    }

    function headerRow(rows, required) {
      return rows.findIndex(row => required.every(word =>
        row.some(cell => norm(cell).includes(norm(word)))
      ));
    }

    function rowObj(headers, row) {
      const output = {};
      headers.forEach((header, i) => {
        const value = row[i];
        if (header !== "" && header != null) {
          output[norm(header)] = value instanceof Date
            ? value.toISOString().slice(0,10)
            : String(value ?? "").trim();
        }
      });
      return output;
    }

    function findVal(obj, ...names) {
      const keys = Object.keys(obj);
      for (const name of names) {
        const normalized = norm(name);
        const key = keys.find(k => k === normalized) || keys.find(k => k.includes(normalized));
        if (key) return obj[key];
      }
      return "";
    }

    function excelDate(value) {
      if (!value) return "";
      if (/^\d{4}-\d\d-\d\d$/.test(value)) return value;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toISOString().slice(0,10);
    }

    function splitFullName(value) {
      const text = String(value || "").trim();
      if (!text) return {apellido:"", nombre:""};

      if (text.includes(",")) {
        const [apellido, ...names] = text.split(",");
        return {apellido:apellido.trim(), nombre:names.join(",").trim()};
      }

      const parts = text.split(/\s+/);
      return {apellido:parts.shift() || "", nombre:parts.join(" ")};
    }

    /*
      Mapeo específico de ALTAS.xlsx:
      N° Legajo, Nombre y Apellido, DNI, CUIL, F.NACIMIENTO, Fecha Alta,
      N. MADRE, N. PADRE, Domicilio, C.P., Celular, Telefono, MAIL,
      N°CBU, N° CUENTA, BANCO, ESTADO CIVIL, COD OBRA y OBRA SOCIAL.
    */
    function mapAlta(row) {
      const fullName = findVal(row, "nombre y apellido");
      const person = splitFullName(fullName);
      const celular = findVal(row, "celular");
      const telefono = findVal(row, "telefono");

      return {
        legajo: findVal(row, "n legajo", "legajo"),
        nombre: person.nombre || findVal(row, "nombre"),
        apellido: person.apellido || findVal(row, "apellido"),
        dni: findVal(row, "dni"),
        cuil: findVal(row, "cuil"),
        fechaNacimiento: excelDate(findVal(row, "f nacimiento", "fecha nacimiento", "nacimiento")),
        nacionalidad: findVal(row, "nacionalidad"),
        fechaIngreso: excelDate(findVal(row, "fecha alta", "alta")),
        madre: findVal(row, "n madre", "madre"),
        padre: findVal(row, "n padre", "padre"),
        domicilio: findVal(row, "domicilio"),
        codigoPostal: findVal(row, "c p", "codigo postal"),
        telefono: celular || telefono,
        telefonoAlternativo: telefono && telefono !== celular ? telefono : "",
        email: findVal(row, "mail", "email"),
        cbu: findVal(row, "n cbu", "cbu"),
        numeroCuenta: findVal(row, "n cuenta", "cuenta"),
        banco: findVal(row, "banco"),
        haberes: findVal(row, "haberes"),
        estadoCivil: findVal(row, "estado civil"),
        codigoObra: findVal(row, "cod obra", "codigo obra"),
        obraSocial: findVal(row, "obra social"),

        foto: "",
        habilitacionTipo: "",
        habilitacionNumero: "",
        habilitacionVencimiento: "",
        habilitacionOrganismo: "",
        categoria: "Vigilador",
        horario: "",
        camisaTalla: "",
        camisaCantidad: "",
        pantalonTalla: "",
        pantalonCantidad: "",
        tricotaTalla: "",
        tricotaCantidad: "",
        camperaTalla: "",
        camperaCantidad: "",
        corbataCantidad: "",
        calzadoTalla: "",
        cinturonTalla: "",
        cinturonCantidad: "",
        observaciones: "",
        entregas: [],
        evaluaciones: [],
        sanciones: []
      };
    }

    async function commitInChunks(items, write) {
      for (let i = 0; i < items.length; i += 450) {
        const batch = db.batch();
        items.slice(i, i + 450).forEach(item => write(batch, item));
        await batch.commit();
      }
    }

    async function excelAltas(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const workbook = XLSX.read(await file.arrayBuffer(), {type:"array",cellDates:true});
        const sheetName = workbook.SheetNames.find(name => norm(name) === "altas");

        if (!sheetName) throw new Error("No existe una hoja llamada ALTAS.");

        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
          header: 1,
          defval: "",
          raw: true
        });

        const headerIndex = headerRow(rows, ["legajo", "nombre", "dni"]);

        if (headerIndex < 0) {
          throw new Error("No se encontró la fila de encabezados. Se esperan N° Legajo, Nombre y Apellido y DNI.");
        }

        const altas = rows.slice(headerIndex + 1)
          .filter(row => row.some(cell => String(cell).trim() !== ""))
          .map(row => mapAlta(rowObj(rows[headerIndex], row)))
          .filter(v => v.legajo || v.dni || v.nombre);

        if (!altas.length) throw new Error("No hay registros de altas debajo de los encabezados.");

        const byDni = new Map(vigiladores
          .filter(v => v.dni)
          .map(v => [String(v.dni).replace(/\D/g,""), v]));

        const byLegajo = new Map(vigiladores
          .filter(v => v.legajo)
          .map(v => [norm(v.legajo), v]));

        const changes = altas.map(v => {
          const previous = byDni.get(String(v.dni).replace(/\D/g,"")) || byLegajo.get(norm(v.legajo));
          return {...v, _id:previous?.id || "", _action:previous ? "Actualizar" : "Crear"};
        });

        showPreview(
          "Altas detectadas",
          changes.map(v => ({
            "Acción": v._action,
            "Legajo": v.legajo,
            "Nombre": `${v.apellido}, ${v.nombre}`,
            "DNI": v.dni,
            "CUIL": v.cuil,
            "Fecha alta": v.fechaIngreso,
            "Obra social": v.obraSocial
          })),
          async () => {
            loading(true);

            try {
              await commitInChunks(changes, (batch, v) => {
                const {_id, _action, ...data} = v;
                data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

                if (_id) {
                  batch.set(db.collection("vigiladores").doc(_id), data, {merge:true});
                } else {
                  data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                  batch.set(db.collection("vigiladores").doc(), data);
                }
              });

              closeModal();

              const nuevos = changes.filter(v => v._action === "Crear").length;
              const actualizados = changes.filter(v => v._action === "Actualizar").length;
              toast(`${changes.length} altas procesadas: ${nuevos} nuevas y ${actualizados} actualizadas.`);
            } catch (error) {
              toast("No se pudo importar: " + error.message, true);
            } finally {
              loading(false);
            }
          }
        );
      } catch (error) {
        toast(error.message, true);
      } finally {
        event.target.value = "";
      }
    }

    async function excelSuspensiones(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const workbook = XLSX.read(await file.arrayBuffer(), {type:"array"});
        const found = [];

        for (const sheetName of workbook.SheetNames) {
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header:1,defval:""});
          const h = headerRow(rows, ["fecha", "motivo"]);
          if (h < 0) continue;

          const sanciones = rows.slice(h + 1)
            .filter(row => row.some(Boolean))
            .map(row => {
              const obj = rowObj(rows[h], row);
              return {
                fecha: String(findVal(obj, "fecha")),
                motivo: String(findVal(obj, "motivo")),
                tipo: String(findVal(obj, "dias", "apercibimiento", "sancion")),
                servicio: String(findVal(obj, "servicio"))
              };
            });

          if (sanciones.length) {
            const target = vigiladores.find(v =>
              norm(`${v.apellido} ${v.nombre}`) === norm(sheetName) ||
              norm(`${v.nombre} ${v.apellido}`) === norm(sheetName)
            );

            found.push({hoja:sheetName, target, sanciones});
          }
        }

        if (!found.length) throw new Error("No se hallaron hojas con encabezados FECHA y MOTIVO.");

        showPreview(
          "Suspensiones encontradas",
          found.map(x => ({
            "Vigilador": x.target ? `${x.target.apellido}, ${x.target.nombre}` : "SIN COINCIDENCIA",
            "Hoja": x.hoja,
            "Sanciones": x.sanciones.length
          })),
          async () => {
            loading(true);

            try {
              const batch = db.batch();
              let total = 0;

              found.forEach(x => {
                if (x.target) {
                  batch.update(db.collection("vigiladores").doc(x.target.id), {
                    sanciones: [...(x.target.sanciones || []), ...x.sanciones]
                  });
                  total += x.sanciones.length;
                }
              });

              await batch.commit();
              closeModal();
              toast(`${total} sanciones incorporadas.`);
            } catch (error) {
              toast(error.message, true);
            } finally {
              loading(false);
            }
          }
        );
      } catch (error) {
        toast(error.message, true);
      } finally {
        event.target.value = "";
      }
    }

    function showPreview(title, rows, confirm) {
      const headers = rows.length ? Object.keys(rows[0]) : [];

      $("#modalHost").innerHTML = `
        <div class="modal-bg">
          <div class="modal" style="max-width:720px">
            <div class="modal-head"><strong>${title}</strong></div>
            <div class="modal-body">
              <p class="muted">Vista previa: se muestran hasta 5 registros. Confirmá para guardar los resultados.</p>
              <div style="overflow:auto">
                ${rows.length ? `
                  <table class="data-table">
                    <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
                    <tbody>
                      ${rows.slice(0,5).map(row => `
                        <tr>${Object.values(row).map(value => `<td>${esc(value)}</td>`).join("")}</tr>
                      `).join("")}
                    </tbody>
                  </table>` : "Sin datos"}
              </div>
            </div>
            <div class="modal-foot">
              <button class="secondary" onclick="closeModal()">Cancelar</button>
              <button class="primary" id="confirmImport">Confirmar importación</button>
            </div>
          </div>
        </div>`;

      $("#confirmImport").onclick = confirm;
    }

    init();
  </script>

    service cloud.firestore {
      match /databases/{database}/documents {
        match /vigiladores/{document=**} {
          allow read, write: if request.auth != null;
        }
      }
    }
  -->
</body>
