    <!-- SCRIPT DE LÓGICA -->
    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE (¡REEMPLAZAR!)
        // ==========================================
        const firebaseConfig = {
	      apiKey: "AIzaSyDBZo39bVcQ3hdhC5FOjYOlwiI-oJ2pCWA",
	      authDomain: "vigiapp-ff701.firebaseapp.com",
	      projectId: "vigiapp-ff701",
	      storageBucket: "vigiapp-ff701.firebasestorage.app",
	      messagingSenderId: "271978217168",
	      appId: "1:271978217168:web:750dab0ca60ac350d1a8d5"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        let vigiladoresData = []; // Array en memoria
        let currentSanciones = []; // Sanciones del vigilador en edición
        let currentEditingId = null; // ID del documento actual
        let currentFotoBase64 = ""; // Foto en edición
        let isLoginMode = true; // Para el toggle del auth form

        // ==========================================
        // 2. UTILIDADES DE INTERFAZ
        // ==========================================
        function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }
        
        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `p-4 rounded shadow-lg text-white font-medium flex items-center gap-2 transform translate-x-full transition-transform duration-300 ${type === 'success' ? 'bg-green-600' : type === 'warning' ? 'bg-orange-500' : 'bg-red-600'}`;
            toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'circle-exclamation'}"></i> ${msg}`;
            
            const container = document.getElementById('toastContainer');
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-x-full'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // 3. AUTENTICACIÓN
        // ==========================================
        const authForm = document.getElementById('authForm');
        const toggleAuthBtn = document.getElementById('toggleAuthMode');
        const authBtn = document.getElementById('authBtn');

        toggleAuthBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            authBtn.textContent = isLoginMode ? 'Iniciar Sesión' : 'Registrarse';
            toggleAuthBtn.textContent = isLoginMode ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia Sesión';
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;
            showLoading();
            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    await auth.createUserWithEmailAndPassword(email, pass);
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
            hideLoading();
        });

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('userEmail').textContent = user.email;
                cargarVigiladores();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
            }
        });

        // ==========================================
        // 4. CRUD Y BASE DE DATOS
        // ==========================================
        async function cargarVigiladores() {
            showLoading();
            try {
                const snapshot = await db.collection('vigiladores').get();
                vigiladoresData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTable();
            } catch (error) {
                showToast("Error al cargar datos. Revisa las reglas de Firestore.", 'error');
                console.error(error);
            }
            hideLoading();
        }

        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('vigiladoresTableBody');
            tbody.innerHTML = '';

            const filtrados = vigiladoresData.filter(v => {
                const fullStr = `${v.personal?.nombre || ''} ${v.personal?.apellido || ''} ${v.personal?.dni || ''}`.toLowerCase();
                return fullStr.includes(search);
            });

            // Ordenamos alfabéticamente por apellido y luego nombre
            filtrados.sort((a, b) => {
                let nameA = (a.personal?.apellido || '') + (a.personal?.nombre || '');
                let nameB = (b.personal?.apellido || '') + (b.personal?.nombre || '');
                return nameA.localeCompare(nameB);
            });

            filtrados.forEach(v => {
                const p = v.personal || {};
                const name = `${p.apellido || ''}, ${p.nombre || ''}`;
                const fotoSrc = p.foto || 'https://via.placeholder.com/40';
                const tieneSanciones = (v.disciplina && v.disciplina.length > 0);
                const leg = v.laborales?.legajo || '-';

                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3"><img src="${fotoSrc}" class="w-10 h-10 rounded-full object-cover border"></td>
                    <td class="p-3 font-bold text-gray-600">${leg}</td>
                    <td class="p-3 font-medium text-gray-800">${name}</td>
                    <td class="p-3 text-gray-600">${p.dni || '-'}</td>
                    <td class="p-3 text-gray-600">${v.laborales?.categoria || '-'}</td>
                    <td class="p-3 text-center">
                        ${tieneSanciones ? '<span class="text-red-500" title="Tiene sanciones"><i class="fa-solid fa-triangle-exclamation"></i> Sancionado</span>' : '<span class="text-green-500"><i class="fa-solid fa-check-circle"></i> OK</span>'}
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="editarVigilador('${v.id}')" class="text-blue-500 hover:text-blue-700 mr-3" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="eliminarVigilador('${v.id}')" class="text-red-500 hover:text-red-700" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function guardarVigilador() {
            const p = {
                nombre: document.getElementById('v_nombre').value,
                apellido: document.getElementById('v_apellido').value,
                dni: document.getElementById('v_dni').value,
                fechaNacimiento: document.getElementById('v_fechanac').value,
                estadoCivil: document.getElementById('v_estadocivil').value,
                madre: document.getElementById('v_madre').value,
                padre: document.getElementById('v_padre').value,
                domicilio: document.getElementById('v_domicilio').value,
                cp: document.getElementById('v_cp').value,
                telefono: document.getElementById('v_telefono').value,
                email: document.getElementById('v_email').value,
                foto: currentFotoBase64
            };
            const hab = {
                tipo: document.getElementById('v_hab_tipo').value,
                numero: document.getElementById('v_hab_numero').value,
                vencimiento: document.getElementById('v_hab_vto').value,
                organismo: document.getElementById('v_hab_org').value
            };
            const lab = {
                legajo: document.getElementById('v_legajo').value,
                ingreso: document.getElementById('v_ingreso').value,
                categoria: document.getElementById('v_categoria').value,
                horario: document.getElementById('v_horario').value,
                obraSocial: document.getElementById('v_obrasocial').value,
                sindicato: document.getElementById('v_sindicato').value,
                cuil: document.getElementById('v_cuil').value,
                banco: document.getElementById('v_banco').value,
                cuenta: document.getElementById('v_cuenta').value,
                cbu: document.getElementById('v_cbu').value
            };
            const ropa = {
                camisa: { talle: document.getElementById('v_ropa_camisa_t').value, cant: document.getElementById('v_ropa_camisa_c').value },
                pantalon: { talle: document.getElementById('v_ropa_pantalon_t').value, cant: document.getElementById('v_ropa_pantalon_c').value },
                tricota: { talle: document.getElementById('v_ropa_tricota_t').value, cant: document.getElementById('v_ropa_tricota_c').value },
                campera: { talle: document.getElementById('v_ropa_campera_t').value, cant: document.getElementById('v_ropa_campera_c').value },
                cinto: { talle: document.getElementById('v_ropa_cinto_t').value, cant: document.getElementById('v_ropa_cinto_c').value },
                corbatas: document.getElementById('v_ropa_corbata_c').value,
                calzado: document.getElementById('v_ropa_calzado').value
            };
            const rrhh = { observaciones: document.getElementById('v_observaciones').value };

            const dataToSave = {
                personal: p,
                habilitaciones: hab,
                laborales: lab,
                ropa: ropa,
                rrhh: rrhh,
                disciplina: currentSanciones
            };

            showLoading();
            try {
                if (currentEditingId) {
                    await db.collection('vigiladores').doc(currentEditingId).set(dataToSave, { merge: true });
                    showToast('Vigilador actualizado');
                } else {
                    await db.collection('vigiladores').add(dataToSave);
                    showToast('Vigilador creado exitosamente');
                }
                closeModal();
                cargarVigiladores();
            } catch (error) {
                showToast(error.message, 'error');
            }
            hideLoading();
        }

        async function eliminarVigilador(id) {
            if (confirm('¿Seguro que deseas eliminar este vigilador? Esta acción no se puede deshacer.')) {
                showLoading();
                try {
                    await db.collection('vigiladores').doc(id).delete();
                    showToast('Eliminado correctamente');
                    cargarVigiladores();
                } catch (e) {
                    showToast(e.message, 'error');
                }
                hideLoading();
            }
        }

        // ==========================================
        // 5. LÓGICA DE MODAL Y TABS
        // ==========================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function openModal() {
            limpiarFormulario();
            document.getElementById('modalTitle').textContent = 'Nuevo Vigilador';
            document.getElementById('vigiladorModal').classList.remove('hidden');
            
            // Activar la primera tab por defecto
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-personal').classList.add('active');
            document.querySelector('.tab-btn').classList.add('active'); // Selecciona el primer botón
        }

        function closeModal() {
            document.getElementById('vigiladorModal').classList.add('hidden');
        }

        function limpiarFormulario() {
            currentEditingId = null;
            currentFotoBase64 = "";
            currentSanciones = [];
            document.getElementById('previewFoto').src = 'https://via.placeholder.com/64';
            const inputs = document.querySelectorAll('#formContainer input, #formContainer select, #formContainer textarea');
            inputs.forEach(input => {
                if(input.type === 'file') input.value = '';
                else input.value = '';
            });
            // Restaurar selects por defecto
            document.getElementById('v_categoria').value = 'Vigilador';
            document.getElementById('v_estadocivil').value = 'SOLTERO';
            renderSanciones();
        }

        function editarVigilador(id) {
            const v = vigiladoresData.find(x => x.id === id);
            if (!v) return;
            
            limpiarFormulario();
            currentEditingId = id;
            document.getElementById('modalTitle').textContent = 'Editar Vigilador';
            
            // Llenar campos
            const p = v.personal || {};
            document.getElementById('v_nombre').value = p.nombre || '';
            document.getElementById('v_apellido').value = p.apellido || '';
            document.getElementById('v_dni').value = p.dni || '';
            document.getElementById('v_fechanac').value = p.fechaNacimiento || '';
            
            // Asegurarse de que el Select de estado civil tome el valor correcto independientemente de mayúsculas
            if (p.estadoCivil) {
                const estado = p.estadoCivil.toUpperCase();
                const selectEstado = document.getElementById('v_estadocivil');
                let optionExists = Array.from(selectEstado.options).some(opt => opt.value === estado);
                if(optionExists) selectEstado.value = estado;
            }

            document.getElementById('v_madre').value = p.madre || '';
            document.getElementById('v_padre').value = p.padre || '';
            document.getElementById('v_domicilio').value = p.domicilio || '';
            document.getElementById('v_cp').value = p.cp || '';
            document.getElementById('v_telefono').value = p.telefono || '';
            document.getElementById('v_email').value = p.email || '';
            
            if (p.foto) {
                currentFotoBase64 = p.foto;
                document.getElementById('previewFoto').src = p.foto;
            }

            const hab = v.habilitaciones || {};
            document.getElementById('v_hab_tipo').value = hab.tipo || '';
            document.getElementById('v_hab_numero').value = hab.numero || '';
            document.getElementById('v_hab_vto').value = hab.vencimiento || '';
            document.getElementById('v_hab_org').value = hab.organismo || '';

            const lab = v.laborales || {};
            document.getElementById('v_legajo').value = lab.legajo || '';
            document.getElementById('v_ingreso').value = lab.ingreso || '';
            document.getElementById('v_categoria').value = lab.categoria || 'Vigilador';
            document.getElementById('v_horario').value = lab.horario || '';
            document.getElementById('v_obrasocial').value = lab.obraSocial || '';
            document.getElementById('v_sindicato').value = lab.sindicato || '';
            document.getElementById('v_cuil').value = lab.cuil || '';
            document.getElementById('v_banco').value = lab.banco || '';
            document.getElementById('v_cuenta').value = lab.cuenta || '';
            document.getElementById('v_cbu').value = lab.cbu || '';

            const ro = v.ropa || {};
            document.getElementById('v_ropa_camisa_t').value = ro.camisa?.talle || '';
            document.getElementById('v_ropa_camisa_c').value = ro.camisa?.cant || '';
            document.getElementById('v_ropa_pantalon_t').value = ro.pantalon?.talle || '';
            document.getElementById('v_ropa_pantalon_c').value = ro.pantalon?.cant || '';
            document.getElementById('v_ropa_tricota_t').value = ro.tricota?.talle || '';
            document.getElementById('v_ropa_tricota_c').value = ro.tricota?.cant || '';
            document.getElementById('v_ropa_campera_t').value = ro.campera?.talle || '';
            document.getElementById('v_ropa_campera_c').value = ro.campera?.cant || '';
            document.getElementById('v_ropa_cinto_t').value = ro.cinto?.talle || '';
            document.getElementById('v_ropa_cinto_c').value = ro.cinto?.cant || '';
            document.getElementById('v_ropa_corbata_c').value = ro.corbatas || '';
            document.getElementById('v_ropa_calzado').value = ro.calzado || '';

            document.getElementById('v_observaciones').value = v.rrhh?.observaciones || '';
            
            currentSanciones = v.disciplina || [];
            renderSanciones();

            document.getElementById('vigiladorModal').classList.remove('hidden');
            
            // Activar la primera tab por defecto
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-personal').classList.add('active');
            document.querySelector('.tab-btn').classList.add('active');
        }

        // ==========================================
        // 6. UTILIDADES ESPECÍFICAS
        // ==========================================
        function convertPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentFotoBase64 = ev.target.result;
                document.getElementById('previewFoto').src = currentFotoBase64;
            };
            reader.readAsDataURL(file);
        }

        function agregarSancionUI() {
            const fecha = document.getElementById('ds_fecha').value;
            const dias = document.getElementById('ds_dias').value;
            const servicio = document.getElementById('ds_servicio').value;
            const motivo = document.getElementById('ds_motivo').value;

            if (!fecha || !motivo) return showToast('Fecha y Motivo son obligatorios', 'warning');
            
            currentSanciones.push({ fecha, dias, servicio, motivo });
            document.getElementById('ds_fecha').value = '';
            document.getElementById('ds_dias').value = '';
            document.getElementById('ds_servicio').value = '';
            document.getElementById('ds_motivo').value = '';
            renderSanciones();
        }

        function removerSancion(index) {
            currentSanciones.splice(index, 1);
            renderSanciones();
        }

        function renderSanciones() {
            const body = document.getElementById('sancionesTableBody');
            body.innerHTML = '';
            currentSanciones.forEach((s, i) => {
                body.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">${s.fecha}</td>
                        <td class="p-2">${s.dias}</td>
                        <td class="p-2">${s.servicio}</td>
                        <td class="p-2">${s.motivo}</td>
                        <td class="p-2 text-right">
                            <button onclick="removerSancion(${i})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // ==========================================
        // 7. IMPORTACIÓN DESDE EXCEL (SHEETJS) - CORREGIDO PARA ALTAS.XLSX
        // ==========================================
        async function handleImportAltas(event) {
            const file = event.target.files[0];
            if (!file) return;
            showLoading();
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    if (!workbook.SheetNames.includes("ALTAS")) {
                        throw new Error("El archivo no contiene una hoja llamada 'ALTAS'");
                    }

                    const sheet = workbook.Sheets["ALTAS"];
                    
                    // range: 5 indica que las columnas reales empiezan en la fila 6 de excel.
                    // raw: false, dateNF: "yyyy-mm-dd" pre-formatea las fechas automáticamente
                    const json = XLSX.utils.sheet_to_json(sheet, { range: 5, raw: false, dateNF: "yyyy-mm-dd" });
                    
                    let importCount = 0;
                    
                    for (const row of json) {
                        // Evita procesar filas totalmente vacías
                        if (!row["DNI"]) continue;

                        // 1. Separar "Apellido, Nombre"
                        let fullName = row["Nombre y Apellido"] || "";
                        let apellido = "";
                        let nombre = "";
                        if (fullName.includes(",")) {
                            let partes = fullName.split(",");
                            apellido = partes[0].trim();
                            nombre = partes[1].trim();
                        } else {
                            nombre = fullName.trim(); 
                        }

                        // 2. Normalizar fechas a formato YYYY-MM-DD
                        const formatearFecha = (fechaRaw) => {
                            if(!fechaRaw) return "";
                            if(typeof fechaRaw === 'string') {
                                // Convertir DD/MM/YYYY a YYYY-MM-DD si viene en formato barra
                                if (fechaRaw.includes("/")) {
                                    let f = fechaRaw.split("/");
                                    if(f.length === 3) return `${f[2]}-${f[1].padStart(2, '0')}-${f[0].padStart(2, '0')}`;
                                }
                                return fechaRaw;
                            }
                            return "";
                        };

                        // 3. Mapear los campos leídos a la estructura
                        const newGuard = {
                            personal: {
                                nombre: nombre,
                                apellido: apellido,
                                // Eliminar puntos del DNI si existieran
                                dni: String(row["DNI"] || "").replace(/\D/g, ''),
                                fechaNacimiento: formatearFecha(row["F.NACIMIENTO"]),
                                estadoCivil: (row["ESTADO CIVIL"] || "").toUpperCase(),
                                madre: row["N. MADRE"] || "",
                                padre: row["N. PADRE"] || "",
                                domicilio: row["Domicilio"] || "",
                                cp: String(row["C.P."] || ""),
                                // Priorizar celular frente a teléfono
                                telefono: String(row["Celular"] || row["Telefono"] || ""),
                                email: row["MAIL"] || "",
                                foto: ""
                            },
                            laborales: {
                                legajo: String(row["Nº Legajo"] || ""),
                                ingreso: formatearFecha(row["Fecha Alta"]),
                                categoria: "Vigilador", // Categoría por defecto
                                cuil: String(row["CUIL"] || ""),
                                banco: row["BANCO"] || "",
                                cuenta: String(row["N° CUENTA"] || ""),
                                cbu: String(row["N°CBU"] || ""),
                                obraSocial: row["OBRA SOCIAL"] || "",
                                horario: "",
                                sindicato: ""
                            },
                            habilitaciones: { tipo: "", numero: "", vencimiento: "", organismo: "" },
                            ropa: {
                                camisa: { talle: "", cant: "" }, pantalon: { talle: "", cant: "" },
                                tricota: { talle: "", cant: "" }, campera: { talle: "", cant: "" },
                                cinto: { talle: "", cant: "" }, corbatas: "", calzado: ""
                            },
                            rrhh: { observaciones: "" },
                            disciplina: []
                        };
                        
                        // Guardar en Firestore
                        await db.collection('vigiladores').add(newGuard);
                        importCount++;
                    }
                    
                    showToast(`Se importaron ${importCount} altas correctamente`);
                    cargarVigiladores();
                    
                } catch (error) {
                    console.error(error);
                    showToast("Error en importación: " + error.message, 'error');
                }
                hideLoading();
                event.target.value = ''; // Reset input file
            };
            
            reader.readAsArrayBuffer(file);
        }

        async function handleImportSanciones(event) {
            const file = event.target.files[0];
            if (!file) return;
            showLoading();

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let totalSanciones = 0;

                    // Cada hoja = Nombre del vigilador
                    for (const sheetName of workbook.SheetNames) {
                        const sheet = workbook.Sheets[sheetName];
                        const rows = XLSX.utils.sheet_to_json(sheet);
                        
                        // Buscar el vigilador (ignorando mayúsculas/espacios extra)
                        const searchName = sheetName.trim().toLowerCase();
                        const vigilador = vigiladoresData.find(v => {
                            const vName = `${v.personal.apellido} ${v.personal.nombre}`.trim().toLowerCase();
                            const vNameRev = `${v.personal.nombre} ${v.personal.apellido}`.trim().toLowerCase();
                            return vName === searchName || vNameRev === searchName;
                        });

                        if (vigilador && rows.length > 0) {
                            const nuevasSanciones = rows.map(r => ({
                                fecha: r["FECHA"] || r["Fecha"] || "",
                                motivo: r["MOTIVO"] || r["Motivo"] || "",
                                dias: r["DIAS"] || r["Dias"] || r["Castigo"] || "",
                                servicio: r["SERVICIO"] || r["Servicio"] || ""
                            })).filter(s => s.fecha && s.motivo); // Solo las válidas

                            if (nuevasSanciones.length > 0) {
                                await db.collection('vigiladores').doc(vigilador.id).update({
                                    disciplina: firebase.firestore.FieldValue.arrayUnion(...nuevasSanciones)
                                });
                                totalSanciones += nuevasSanciones.length;
                            }
                        }
                    }
                    showToast(`Se importaron ${totalSanciones} sanciones en total`);
                    cargarVigiladores();
                } catch (error) {
                    showToast(error.message, 'error');
                }
                hideLoading();
                event.target.value = ''; // Reset
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
